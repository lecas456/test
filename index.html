<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mamíferos — Rede Filogenética</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root{--bg:#030318;--panel-bg:rgba(8,8,35,0.96);--text:#e0e8ff;--dim:#556080;--cyan:#00d4ff;--border:rgba(0,212,255,0.15);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'SF Pro Display','Segoe UI',system-ui,sans-serif;}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#graph{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
.header{position:fixed;top:0;left:0;right:0;z-index:10;padding:16px 20px 40px;background:linear-gradient(to bottom,rgba(3,3,24,.96) 0%,transparent 100%);pointer-events:none;}
.header h1{font-size:14px;font-weight:300;letter-spacing:5px;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 24px rgba(0,212,255,.7);}
.header p{font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:3px;}
#legend{position:fixed;top:62px;right:14px;z-index:10;background:rgba(3,3,24,.8);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:8px 11px;max-width:136px;max-height:calc(100vh - 120px);overflow-y:auto;}
#legend::-webkit-scrollbar{width:3px;}
#legend::-webkit-scrollbar-thumb{background:rgba(0,212,255,.3);border-radius:2px;}
.leg-title{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
.leg-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.leg-label{font-size:9px;color:rgba(200,215,240,.85);}
#panel{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--panel-bg);backdrop-filter:blur(24px);border-top:1px solid rgba(0,212,255,.2);border-radius:20px 20px 0 0;padding:0 20px 32px;transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);max-height:62vh;overflow-y:auto;}
#panel.open{transform:translateY(0);}
.handle{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:13px auto 16px;}
#closebtn{position:absolute;top:13px;right:15px;background:rgba(255,255,255,.08);border:none;color:#fff;width:26px;height:26px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.p-emoji{font-size:50px;text-align:center;margin-bottom:8px;line-height:1;}
.p-name{font-size:19px;font-weight:600;text-align:center;}
.p-sci{font-size:11px;font-style:italic;color:var(--dim);text-align:center;padding:3px 0 12px;}
.p-badge{display:block;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:3px 12px;border-radius:20px;width:fit-content;margin:0 auto 12px;}
.p-desc{font-size:13px;line-height:1.75;color:rgba(210,225,255,.88);}
.p-facts{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.fact{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:9px 11px;}
.fact-k{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
.fact-v{font-size:11px;font-weight:500;color:#fff;}
#resetbtn{position:fixed;bottom:18px;right:15px;z-index:11;width:42px;height:42px;border-radius:50%;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);color:var(--cyan);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:background .2s;}
#resetbtn:hover{background:rgba(0,212,255,.18);}
.hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:10;font-size:9px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;pointer-events:none;opacity:1;transition:opacity 1s;}
.hint.gone{opacity:0;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<svg id="graph"></svg>
<div class="header"><h1>Mamíferos</h1><p>Rede Filogenética · Toque para explorar · Arraste para mover</p></div>
<div id="legend"></div>
<div id="panel"><div class="handle"></div><button id="closebtn">✕</button><div id="pc"></div></div>
<button id="resetbtn" title="Centralizar">⊕</button>
<div class="hint" id="hint">Pinça para zoom</div>
<script>
// STARS
(function(){const c=document.getElementById('stars');c.width=window.innerWidth;c.height=window.innerHeight;const x=c.getContext('2d');for(let i=0;i<280;i++){x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.2,0,6.28);x.fillStyle=`rgba(180,200,255,${(Math.random()*.6+.2).toFixed(2)})`;x.fill();}})();
setTimeout(()=>document.getElementById('hint').classList.add('gone'),4000);

// COLORS — one per order-level clade
const CC={
  root:'#FFD700',theria:'#e0a000',
  monotremata:'#00CED1',marsupialia:'#FF6B35',
  placentalia:'#a070e0',afrotheria:'#DA70D6',xenarthra:'#00C853',
  boreoeutheria:'#40C4FF',euarchontoglires:'#00E5FF',
  primates:'#00BCD4',rodentia:'#FF4081',lagomorpha:'#FFEB3B',
  laurasiatheria:'#FF6E40',carnivora:'#F44336',
  cetartiodactyla:'#2196F3',perissodactyla:'#FF9800',
  chiroptera:'#CE93D8',eulipotyphla:'#8BC34A',
};

// NODES
const nodes=[
// ── ROOT ──
{id:'mammalia',label:'Mammalia',type:'root',clade:'root',emoji:'🌍',scientific:'Mammalia',
 desc:'Classe dos vertebrados que amamentam filhotes com leite. Surgiram há ~220 Ma de cinodontes terápsidos. Colonizaram todos os habitats: terra, ar e mar, com mais de 5.500 espécies.',
 facts:{'Espécies':'~5.500','Origem':'~220 Ma','Habitats':'Todos','Nível':'Classe'}},

// ── SUPERORDERS / SUBCLASSES ──
{id:'theria',label:'Theria',type:'clade',clade:'theria',emoji:'🧬',scientific:'Theria',
 desc:'Subclasse dos mamíferos vivíparos — inclui marsupiais e placentários. Não botam ovos; embriões se desenvolvem internamente.',
 facts:{'Espécies':'~5.400','Origem':'~180 Ma','Reprod.':'Vivíparos','Nível':'Subclasse'}},
{id:'monotremata',label:'Monotremata',type:'clade',clade:'monotremata',emoji:'🥚',scientific:'Monotremata',
 desc:'Único grupo de mamíferos ovíparos. Possuem cloaca única e eletrorrecepção para detectar presas. Restritos à Austrália e Nova Guiné.',
 facts:{'Espécies':'5','Origem':'~166 Ma','Região':'Oceania','Nível':'Ordem'}},
{id:'marsupialia',label:'Marsupialia',type:'clade',clade:'marsupialia',emoji:'🦘',scientific:'Metatheria',
 desc:'Mamíferos com marsúpio: filhotes nascem minúsculos (~1 cm) e completam o desenvolvimento na bolsa. Dominam a fauna australiana.',
 facts:{'Espécies':'~330','Origem':'~80 Ma','Região':'Oceania/Am. Sul','Nível':'Infraclasse'}},
{id:'placentalia',label:'Placentalia',type:'clade',clade:'placentalia',emoji:'🫀',scientific:'Eutheria',
 desc:'Mamíferos com placenta desenvolvida, permitindo gestação prolongada. Grupo mais diverso, de musaranhos a baleias-azuis.',
 facts:{'Espécies':'~5.000','Origem':'~100 Ma','Tipo':'Placentários','Nível':'Infraclasse'}},
{id:'afrotheria',label:'Afrotheria',type:'clade',clade:'afrotheria',emoji:'🐘',scientific:'Afrotheria',
 desc:'Superordem de origem africana revelada por DNA nos anos 1990. Une elefantes, sirênios, hiracóides, aardvarks e outros por ancestralidade comum.',
 facts:{'Espécies':'~100','Origem':'~90 Ma','Região':'África (orig.)','Nível':'Superordem'}},
{id:'xenarthra',label:'Xenarthra',type:'clade',clade:'xenarthra',emoji:'🦥',scientific:'Xenarthra',
 desc:'Grupo exclusivo das Américas — tatus, preguiças e tamanduás. Xenartrias são articulações vertebrais extras que reforçam a coluna.',
 facts:{'Espécies':'~31','Origem':'~60 Ma','Região':'Américas','Nível':'Superordem'}},
{id:'boreoeutheria',label:'Boreoeutheria',type:'clade',clade:'boreoeutheria',emoji:'🌍',scientific:'Boreoeutheria',
 desc:'Maior clado de placentários, com origem boreal. Divide-se em Euarchontoglires e Laurasiatheria.',
 facts:{'Espécies':'~4.800','Origem':'~90 Ma','Divisões':'2','Nível':'Superordem'}},
{id:'euarchontoglires',label:'Euarchontoglires',type:'clade',clade:'euarchontoglires',emoji:'🧠',scientific:'Euarchontoglires',
 desc:'Clado que une primatas, roedores, lagomorfos, tupaiídeos e colugos. Inclui os mamíferos mais encefalizados.',
 facts:{'Espécies':'~2.700','Origem':'~80 Ma','Destaque':'Primatas','Nível':'Grandordem'}},
{id:'primates',label:'Primates',type:'clade',clade:'primates',emoji:'🐒',scientific:'Primates',
 desc:'Visão binocular colorida, polegares oponíveis e alto encéfalo. Mais de 500 espécies, da maioria ameaçada pela destruição florestal.',
 facts:{'Espécies':'~500','Origem':'~65 Ma','Encefaliz.':'Alta','Nível':'Ordem'}},
{id:'rodentia',label:'Rodentia',type:'clade',clade:'rodentia',emoji:'🐭',scientific:'Rodentia',
 desc:'Maior ordem de mamíferos: ~40% de todas as espécies. Incisivos crescem continuamente e precisam ser desgastados.',
 facts:{'Espécies':'~2.200','Origem':'~66 Ma','Diversidade':'Máxima','Nível':'Ordem'}},
{id:'lagomorpha',label:'Lagomorpha',type:'clade',clade:'lagomorpha',emoji:'🐇',scientific:'Lagomorpha',
 desc:'Coelhos, lebres e pikas. Distinguem-se dos roedores pelos dois pares de incisivos superiores e pela cecotrofia.',
 facts:{'Espécies':'~90','Origem':'~60 Ma','Dieta':'Herbívora','Nível':'Ordem'}},
{id:'laurasiatheria',label:'Laurasiatheria',type:'clade',clade:'laurasiatheria',emoji:'🌋',scientific:'Laurasiatheria',
 desc:'Origem no supercontinente Laurásia. A maior diversidade morfológica dos mamíferos: morcegos voadores a baleias oceânicas.',
 facts:{'Espécies':'~2.100','Origem':'~85 Ma','Região':'Laurásia','Nível':'Superordem'}},
{id:'carnivora',label:'Carnivora',type:'clade',clade:'carnivora',emoji:'🦁',scientific:'Carnivora',
 desc:'Inclui felinos, canídeos, ursídeos, mustelídeos e pinípedes. Alguns são herbívoros (panda) ou onívoros.',
 facts:{'Espécies':'~280','Origem':'~60 Ma','Dieta':'Variada','Nível':'Ordem'}},
{id:'cetartiodactyla',label:'Cetartiodactyla',type:'clade',clade:'cetartiodactyla',emoji:'🐋',scientific:'Cetartiodactyla',
 desc:'Une cetáceos e artiodáctilos. Hipopótamos são os parentes vivos mais próximos de baleias — revelado por DNA molecular.',
 facts:{'Espécies':'~350','Origem':'~55 Ma','Habitat':'Terra e Mar','Nível':'Ordem'}},
{id:'perissodactyla',label:'Perissodactyla',type:'clade',clade:'perissodactyla',emoji:'🐴',scientific:'Perissodactyla',
 desc:'Ungulados com número ímpar de dedos. Cavalos (1), rinocerontes (3), antas (4/3). Foram muito mais diversificados no Eoceno.',
 facts:{'Espécies':'17','Origem':'~56 Ma','Dedos':'Ímpar','Nível':'Ordem'}},
{id:'chiroptera',label:'Chiroptera',type:'clade',clade:'chiroptera',emoji:'🦇',scientific:'Chiroptera',
 desc:'Únicos mamíferos com voo verdadeiro. ~1.400 espécies com ecolocação ultrassônica. Essenciais para polinização e controle de insetos.',
 facts:{'Espécies':'~1.400','Origem':'~55 Ma','Voo':'Ativo','Nível':'Ordem'}},
{id:'eulipotyphla',label:'Eulipotyphla',type:'clade',clade:'eulipotyphla',emoji:'🦔',scientific:'Eulipotyphla',
 desc:'Ouriços, toupeiras e musaranhos. Musaranhos têm o maior metabolismo de qualquer mamífero — comem quase seu próprio peso por dia.',
 facts:{'Espécies':'~500','Origem':'~60 Ma','Porte':'Pequeno','Nível':'Ordem'}},

// ── FAMILY NODES ──
// Cetartiodactyla families
{id:'mysticeti',label:'Mysticeti',type:'family',clade:'cetartiodactyla',emoji:'🐋',scientific:'Mysticeti (Baleias de barbatanas)',
 desc:'Subordem das baleias filtradoras — usam barbatanas de queratina para filtrar krill e pequenos peixes. Maiores animais já existentes.',
 facts:{'Espécies':'~15','Habitat':'Oceanos globais','Alim.':'Filtração','Tipo':'Misticetos'}},
{id:'odontoceti',label:'Odontoceti',type:'family',clade:'cetartiodactyla',emoji:'🐬',scientific:'Odontoceti (Cetáceos com dentes)',
 desc:'Baleias, golfinhos e toninhas com dentes. Usam ecolocação ativa — emitem cliques e interpretam ecos para navegar e caçar.',
 facts:{'Espécies':'~70','Habitat':'Oceanos e rios','Ecolocação':'Sim','Tipo':'Odontocetos'}},
{id:'bovidae_f',label:'Bovidae',type:'family',clade:'cetartiodactyla',emoji:'🐄',scientific:'Bovidae',
 desc:'Maior família de artiodáctilos — bovinos, ovinos, caprinos, antílopes e GNU. Todos têm chifres permanentes de queratina sobre núcleo ósseo.',
 facts:{'Espécies':'~140','Origem':'~20 Ma','Chifres':'Permanentes','Habitat':'Savanas, montanhas'}},
{id:'giraffidae_f',label:'Giraffidae',type:'family',clade:'cetartiodactyla',emoji:'🦒',scientific:'Giraffidae',
 desc:'Família com apenas 2 gêneros vivos: girafas e okapis. As girafas são os mais altos animais terrestres; os okapis, descobertos em 1901.',
 facts:{'Espécies':'6','Origem':'~25 Ma','Pescoço':'Longo','Habitat':'África'}},
{id:'hippopotamidae_f',label:'Hippopotamidae',type:'family',clade:'cetartiodactyla',emoji:'🦛',scientific:'Hippopotamidae',
 desc:'Família com hipopótamo comum e hipopótamo-pigmeu. Parentes mais próximos das baleias. Semiacuáticos e altamente territoriais.',
 facts:{'Espécies':'2','Origem':'~55 Ma','Habitat':'Rios africanos','Parente':'Baleias'}},
{id:'suidae_f',label:'Suidae',type:'family',clade:'cetartiodactyla',emoji:'🐗',scientific:'Suidae',
 desc:'Família dos porcos e javalis. Onívoros com focinho adaptado para escavar. O javali-europeu é ancestral do porco doméstico.',
 facts:{'Espécies':'~18','Dieta':'Onívoros','Habitat':'Florestas e savanas','Domesticação':'~9.000 aC'}},
{id:'camelidae_f',label:'Camelidae',type:'family',clade:'cetartiodactyla',emoji:'🐪',scientific:'Camelidae',
 desc:'Camelos, lhamas, alpacas, guanacos e vicunhas. Adaptados a ambientes áridos e de altitude. Corcova armazena gordura, não água.',
 facts:{'Espécies':'7','Origem':'~45 Ma','Orig.':'América do Norte','Habitat':'Desertos e Andes'}},
{id:'cervidae_f',label:'Cervidae',type:'family',clade:'cetartiodactyla',emoji:'🦌',scientific:'Cervidae',
 desc:'Veados, alces, renas e caribus. Únicos ungulados com chifres caducos (caem e re-crescem anualmente), geralmente só nos machos.',
 facts:{'Espécies':'~55','Chifres':'Caducos','Habitat':'Florestas e tundra','Orig.':'Eurasia'}},

// Carnivora families
{id:'felidae_f',label:'Felidae',type:'family',clade:'carnivora',emoji:'🦁',scientific:'Felidae',
 desc:'Família dos felinos: todos são carnívoros obrigatórios com garras retráteis, visão noturna avançada e presas adaptadas para matar.',
 facts:{'Espécies':'~37','Dieta':'Carnívora obrig.','Garras':'Retráteis','Orig.':'~11 Ma'}},
{id:'canidae_f',label:'Canidae',type:'family',clade:'carnivora',emoji:'🐺',scientific:'Canidae',
 desc:'Lobos, raposas, coiotes, chacais e cães. Tipicamente caçadores de resistência com estruturas sociais complexas.',
 facts:{'Espécies':'~36','Social':'Alta','Dieta':'Onívoros','Orig.':'~40 Ma'}},
{id:'ursidae_f',label:'Ursidae',type:'family',clade:'carnivora',emoji:'🐻',scientific:'Ursidae',
 desc:'Ursos — maiores carnívoros terrestres. Apesar do nome da ordem, ursos-panda e ursos-beiçudo são principalmente herbívoros.',
 facts:{'Espécies':'8','Dieta':'Variada','Hibernação':'Alguns','Orig.':'~38 Ma'}},
{id:'mustelidae_f',label:'Mustelidae',type:'family',clade:'carnivora',emoji:'🦦',scientific:'Mustelidae',
 desc:'Lontras, texugos, doninhas, martas e ariranhas. Maior família de carnívoros em espécies. Mustelídeos são ágeis predadores.',
 facts:{'Espécies':'~56','Dieta':'Carnívora','Habitat':'Variado','Orig.':'~40 Ma'}},
{id:'pinnipedia_f',label:'Pinnipedia',type:'family',clade:'carnivora',emoji:'🦭',scientific:'Pinnipedia',
 desc:'Focas, leões-marinhos e morsas. Carnívoros secundariamente adaptados à vida aquática, com membros transformados em nadadeiras.',
 facts:{'Espécies':'~33','Habitat':'Oceanos polares','Orig.':'~27 Ma','Mergulho':'Profundo'}},

// Primates families
{id:'hominidae_f',label:'Hominidae',type:'family',clade:'primates',emoji:'🦍',scientific:'Hominidae (Grandes Símios)',
 desc:'Humanos, chimpanzés, gorilas e orangotangos. Sem cauda, com grande encéfalo e uso de ferramentas complexas.',
 facts:{'Espécies':'7','Orig.':'~15 Ma','Encéfalo':'Maior','DNA humano':'98,7%'}},
{id:'cercopithecidae_f',label:'Cercopithecidae',type:'family',clade:'primates',emoji:'🐒',scientific:'Cercopithecidae',
 desc:'Macacos do Velho Mundo — babuínos, macacos-rhesus, mandrins e colobos. Sem cauda preênsil; narinas próximas.',
 facts:{'Espécies':'~138','Habitat':'África e Ásia','Cauda':'Não preênsil','Orig.':'~25 Ma'}},
{id:'platyrrhini_f',label:'Platyrrhini',type:'family',clade:'primates',emoji:'🐒',scientific:'Platyrrhini (Macacos do Novo Mundo)',
 desc:'Macacos das Américas — macacos-aranha, bugios, saguis e micos. Muitos têm cauda preênsil para agarrar galhos.',
 facts:{'Espécies':'~160','Habitat':'América tropical','Cauda':'Preênsil (alguns)','Orig.':'~35 Ma'}},
{id:'strepsirrhini_f',label:'Strepsirrhini',type:'family',clade:'primates',emoji:'🦊',scientific:'Strepsirrhini (Prossímios)',
 desc:'Lêmures, lorises e gálagos. Considerados mais primitivos entre os primatas. Rhinarium úmido (focinho de cão).',
 facts:{'Espécies':'~90','Habitat':'Madagascar e Ásia','Ativo':'Noturno','Orig.':'~55 Ma'}},

// Rodentia families
{id:'muridae_f',label:'Muridae',type:'family',clade:'rodentia',emoji:'🐭',scientific:'Muridae',
 desc:'Maior família de mamíferos — ratos, camundongos e afins. Extraordinária capacidade adaptativa e reprodutiva.',
 facts:{'Espécies':'~700','Orig.':'~16 Ma','Repr.':'Explosiva','Habitat':'Global'}},
{id:'caviidae_f',label:'Caviidae',type:'family',clade:'rodentia',emoji:'🐾',scientific:'Caviidae',
 desc:'Capivaras, cobaias, mocós e cutias. Roedores de grande porte típicos da América do Sul.',
 facts:{'Espécies':'~18','Região':'América do Sul','Maior':'Capivara','Orig.':'~10 Ma'}},
{id:'sciuridae_f',label:'Sciuridae',type:'family',clade:'rodentia',emoji:'🐿️',scientific:'Sciuridae',
 desc:'Esquilos, marmotas, tâmaras e esquilos-voadores. Adaptados desde florestas tropicais a tundra ártica.',
 facts:{'Espécies':'~285','Habitat':'Global','Voo':'Planadores','Orig.':'~36 Ma'}},
{id:'castoridae_f',label:'Castoridae',type:'family',clade:'rodentia',emoji:'🦫',scientific:'Castoridae',
 desc:'Castores — engenheiros do ecossistema que constroem represas alterando cursos de rios e criando wetlands.',
 facts:{'Espécies':'2','Habitat':'Rios do Hemisfério N','Represas':'Constroem','Orig.':'~24 Ma'}},
{id:'hystricidae_f',label:'Hystricidae',type:'family',clade:'rodentia',emoji:'🦔',scientific:'Hystricidae',
 desc:'Porcos-espinhos do Velho Mundo. Os maiores roedores da Europa e Ásia, com espinhos ocos como defesa.',
 facts:{'Espécies':'11','Espinhos':'Até 35 cm','Habitat':'Europa, Ásia, África','Orig.':'~10 Ma'}},

// Marsupialia families
{id:'macropodidae_f',label:'Macropodidae',type:'family',clade:'marsupialia',emoji:'🦘',scientific:'Macropodidae',
 desc:'Cangurus, wallabies e quokkas. Patas traseiras enormes para saltar; marsúpio orientado para frente.',
 facts:{'Espécies':'~65','Locomoção':'Salto','Habitat':'Austrália','Orig.':'~15 Ma'}},
{id:'dasyuridae_f',label:'Dasyuridae',type:'family',clade:'marsupialia',emoji:'😈',scientific:'Dasyuridae',
 desc:'Marsupiais carnívoros australianos — diabo-da-Tasmânia, quolls e dunnarts. A maioria é predador noturno.',
 facts:{'Espécies':'~75','Dieta':'Carnívora','Habitat':'Austrália e Tasmânia','Orig.':'~15 Ma'}},

// Perissodactyla families
{id:'equidae_f',label:'Equidae',type:'family',clade:'perissodactyla',emoji:'🐴',scientific:'Equidae',
 desc:'Cavalos, zebras, asnos e onagros. Um único dedo funcional (o terceiro), andando na ponta.',
 facts:{'Espécies':'7','Dedos':'1','Vel. máx':'70 km/h','Orig.':'~4 Ma'}},
{id:'rhinocerotidae_f',label:'Rhinocerotidae',type:'family',clade:'perissodactyla',emoji:'🦏',scientific:'Rhinocerotidae',
 desc:'Rinocerontes — três espécies na Ásia, duas na África. "Chifre" de queratina. Cinco espécies, das mais ameaçadas do mundo.',
 facts:{'Espécies':'5','Chifre':'Queratina','Ameaça':'Alta','Orig.':'~50 Ma'}},
{id:'tapiridae_f',label:'Tapiridae',type:'family',clade:'perissodactyla',emoji:'🐾',scientific:'Tapiridae',

// LEGEND
const legendClades=[
  ['monotremata','Monotremata'],['marsupialia','Marsupialia'],
  ['afrotheria','Afrotheria'],['xenarthra','Xenarthra'],
  ['primates','Primates'],['rodentia','Rodentia'],['lagomorpha','Lagomorpha'],
  ['carnivora','Carnivora'],['cetartiodactyla','Cetartiodactyla'],
  ['perissodactyla','Perissodactyla'],['chiroptera','Chiroptera'],['eulipotyphla','Eulipotyphla'],
];
const legend=document.getElementById('legend');
legend.innerHTML='<div class="leg-title">Grupos</div>'+
  legendClades.map(([k,l])=>`<div class="leg-item"><div class="leg-dot" style="background:${CC[k]};box-shadow:0 0 5px ${CC[k]}66"></div><span class="leg-label">${l}</span></div>`).join('');

// D3
const W=window.innerWidth,H=window.innerHeight;
const svg=d3.select('#graph').attr('width',W).attr('height',H);
const defs=svg.append('defs');
function makeGlow(id,color,blur=6,op=0.8){
  const f=defs.append('filter').attr('id',id).attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  f.append('feDropShadow').attr('dx',0).attr('dy',0).attr('stdDeviation',blur).attr('flood-color',color).attr('flood-opacity',op);
}
makeGlow('glow-root','#FFD700',14);
Object.entries(CC).forEach(([k,v])=>makeGlow(`glow-${k}`,v,5,0.7));

const g=svg.append('g');
const zoom=d3.zoom().scaleExtent([0.08,5]).on('zoom',e=>g.attr('transform',e.transform));
svg.call(zoom).on('dblclick.zoom',null);

const nodeMap={};
nodes.forEach(n=>nodeMap[n.id]=n);
const isGroup=n=>n.type==='root'||n.type==='clade';
const isFamily=n=>n.type==='family';

function nodeRadius(d){
  if(d.type==='root') return 30;
  if(d.type==='clade') return 20;
  if(d.type==='family') return 13;
  return 9;
}

const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(links).id(d=>d.id)
    .distance(d=>{
      const s=nodeMap[d.source.id||d.source],t=nodeMap[d.target.id||d.target];
      if(s.type==='root'||t.type==='root') return 200;
      if(isGroup(s)&&isGroup(t)) return 160;
      if((isGroup(s)&&isFamily(t))||(isFamily(s)&&isGroup(t))) return 120;
      if(isFamily(s)&&isFamily(t)) return 90;
      if(isFamily(s)||isFamily(t)) return 75;
      return 55;
    })
    .strength(d=>{
      const s=nodeMap[d.source.id||d.source],t=nodeMap[d.target.id||d.target];
      if(isGroup(s)&&isGroup(t)) return 0.9;
      if(isGroup(s)||isGroup(t)) return 0.7;
      return 0.5;
    })
  )
  .force('charge',d3.forceManyBody().strength(d=>{
    if(d.type==='root') return -1500;
    if(d.type==='clade') return -800;
    if(d.type==='family') return -350;
    return -180;
  }))
  .force('center',d3.forceCenter(W/2,H/2).strength(0.04))
  .force('collide',d3.forceCollide(d=>nodeRadius(d)+8))
  .alphaDecay(0.02);

// LINKS
const linkG=g.append('g');
const linkEl=linkG.selectAll('line').data(links).enter().append('line')
  .attr('stroke',d=>{const t=nodeMap[d.target.id||d.target];return CC[t.clade]||'#fff';})
  .attr('stroke-opacity',0.3)
  .attr('stroke-width',d=>{
    const s=nodeMap[d.source.id||d.source],t=nodeMap[d.target.id||d.target];
    if(isGroup(s)&&isGroup(t)) return 2.5;
    if(isGroup(s)||isGroup(t)) return 1.5;
    return 1;
  });

// NODES
const nodeG=g.append('g');
const nodeEl=nodeG.selectAll('g').data(nodes).enter().append('g')
  .style('cursor','pointer')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;})
  )
  .on('click',(e,d)=>{e.stopPropagation();selectNode(d);})
  .on('touchstart',(e,d)=>{e.stopPropagation();},{passive:true});

// pulse rings (only group/clade nodes)
nodeEl.filter(d=>isGroup(d)).append('circle')
  .attr('class','pr').attr('r',d=>nodeRadius(d)+5)
  .attr('fill','none').attr('stroke',d=>CC[d.clade]).attr('stroke-width',1).attr('stroke-opacity',0.25);

// main circle
nodeEl.append('circle')
  .attr('r',d=>nodeRadius(d))
  .attr('fill',d=>d.type==='root'?'#1a1500':d.type==='clade'?'#08081f':'#060616')
  .attr('stroke',d=>CC[d.clade]||'#fff')
  .attr('stroke-width',d=>d.type==='root'?3:d.type==='clade'?2:d.type==='family'?1.5:1.2)
  .attr('stroke-dasharray',d=>d.type==='family'?'3 2':null)
  .attr('filter',d=>`url(#glow-${d.clade})`);

// emoji
nodeEl.append('text')
  .attr('text-anchor','middle').attr('dominant-baseline','central')
  .attr('font-size',d=>d.type==='root'?16:d.type==='clade'?12:d.type==='family'?9:8)
  .attr('pointer-events','none')
  .text(d=>d.emoji);

// label
nodeEl.append('text')
  .attr('text-anchor','middle').attr('y',d=>nodeRadius(d)+12)
  .attr('font-size',d=>d.type==='root'?10:d.type==='clade'?9:d.type==='family'?8:7)
  .attr('fill',d=>CC[d.clade]||'#fff').attr('fill-opacity',0.88)
  .attr('pointer-events','none')
  .text(d=>d.label);

// selection ring
nodeEl.append('circle').attr('class','sr')
  .attr('r',d=>nodeRadius(d)+7).attr('fill','none')
  .attr('stroke','#fff').attr('stroke-width',1.5)
  .attr('stroke-dasharray','4 3').attr('opacity',0);

sim.on('tick',()=>{
  linkEl.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
        .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  nodeEl.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// pulse
function pulse(){
  d3.selectAll('.pr')
    .transition().duration(2200).ease(d3.easeSinInOut)
    .attr('stroke-opacity',0.55).attr('r',function(){return nodeRadius(d3.select(this.parentNode).datum())+10;})
    .transition().duration(2200).ease(d3.easeSinInOut)
    .attr('stroke-opacity',0.1).attr('r',function(){return nodeRadius(d3.select(this.parentNode).datum())+3;})
    .on('end',pulse);
}
setTimeout(pulse,3000);

// SELECTION
let sel=null;
function selectNode(d){
  d3.selectAll('.sr').attr('opacity',0);
  nodeEl.filter(n=>n.id===d.id).select('.sr').attr('opacity',1);
  sel=d;
  linkEl
    .attr('stroke-opacity',l=>(l.source.id===d.id||l.target.id===d.id)?0.92:0.06)
    .attr('stroke-width',l=>(l.source.id===d.id||l.target.id===d.id)?3:1);
  nodeEl.attr('opacity',n=>{
    if(n.id===d.id) return 1;
    return links.some(l=>(l.source.id===d.id&&l.target.id===n.id)||(l.target.id===d.id&&l.source.id===n.id))?0.9:0.2;
  });
  showPanel(d);
}

svg.on('click',()=>{
  d3.selectAll('.sr').attr('opacity',0);
  linkEl.attr('stroke-opacity',0.3).attr('stroke-width',d=>{
    const s=nodeMap[d.source.id||d.source],t=nodeMap[d.target.id||d.target];
    if(isGroup(s)&&isGroup(t)) return 2.5;
    if(isGroup(s)||isGroup(t)) return 1.5;
    return 1;
  });
  nodeEl.attr('opacity',1);
  closePanel(); sel=null;
});

// PANEL
function showPanel(d){
  const color=CC[d.clade]||'#00d4ff';
  const badge={root:'Raiz',clade:'Ordem/Superordem',family:'Família',species:'Espécie'}[d.type]||d.type;
  const facts=Object.entries(d.facts||{}).map(([k,v])=>`<div class="fact"><div class="fact-k">${k}</div><div class="fact-v">${v}</div></div>`).join('');
  document.getElementById('pc').innerHTML=`
    <div class="p-emoji">${d.emoji}</div>
    <div class="p-name">${d.label}</div>
    <div class="p-sci">${d.scientific}</div>
    <div class="p-badge" style="background:${color}22;border:1px solid ${color}44;color:${color}">${badge}</div>
    <div class="p-desc">${d.desc}</div>
    ${facts?`<div class="p-facts">${facts}</div>`:''}
  `;
  document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');}
document.getElementById('closebtn').addEventListener('click',e=>{
  e.stopPropagation(); closePanel();
  d3.selectAll('.sr').attr('opacity',0);
  linkEl.attr('stroke-opacity',0.3);
  nodeEl.attr('opacity',1); sel=null;
});
document.getElementById('resetbtn').addEventListener('click',()=>{
  svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity);
});

// swipe to close
let ty=0;
document.getElementById('panel').addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
document.getElementById('panel').addEventListener('touchmove',e=>{if(e.touches[0].clientY-ty>60)closePanel();},{passive:true});

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  svg.attr('width',w).attr('height',h);
  sim.force('center',d3.forceCenter(w/2,h/2)).alpha(0.1).restart();
});
</script>
