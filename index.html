<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mamíferos — Rede Filogenética</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --bg: #030318;
  --panel-bg: rgba(8,8,35,0.95);
  --text: #e0e8ff;
  --dim: #556080;
  --cyan: #00d4ff;
  --border: rgba(0,212,255,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'SF Pro Display','Segoe UI',system-ui,sans-serif; }

#stars { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
#graph { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; }

.header {
  position:fixed; top:0; left:0; right:0; z-index:10;
  padding:18px 20px 40px;
  background:linear-gradient(to bottom,rgba(3,3,24,0.95) 0%,transparent 100%);
  pointer-events:none;
}
.header h1 { font-size:15px; font-weight:300; letter-spacing:5px; text-transform:uppercase; color:var(--cyan); text-shadow:0 0 24px rgba(0,212,255,0.7); }
.header p { font-size:10px; letter-spacing:2px; color:var(--dim); margin-top:3px; }

#legend {
  position:fixed; top:68px; right:14px; z-index:10;
  background:rgba(3,3,24,0.75); backdrop-filter:blur(12px);
  border:1px solid var(--border); border-radius:12px;
  padding:10px 12px; max-width:140px;
}
.leg-title { font-size:8px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); margin-bottom:7px; }
.leg-item { display:flex; align-items:center; gap:7px; margin-bottom:5px; cursor:pointer; }
.leg-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.leg-label { font-size:10px; color:rgba(200,215,240,0.85); }

#panel {
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  background:var(--panel-bg); backdrop-filter:blur(24px);
  border-top:1px solid rgba(0,212,255,0.2);
  border-radius:20px 20px 0 0;
  padding:0 20px 30px;
  transform:translateY(100%);
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
  max-height:60vh; overflow-y:auto;
}
#panel.open { transform:translateY(0); }
.handle { width:38px; height:4px; background:rgba(255,255,255,0.15); border-radius:2px; margin:14px auto 18px; }
#closebtn {
  position:absolute; top:14px; right:16px;
  background:rgba(255,255,255,0.08); border:none; color:#fff;
  width:28px; height:28px; border-radius:50%; font-size:14px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.p-emoji { font-size:52px; text-align:center; margin-bottom:10px; line-height:1; }
.p-name { font-size:20px; font-weight:600; text-align:center; }
.p-sci { font-size:12px; font-style:italic; color:var(--dim); text-align:center; margin-top:3px 0 14px; padding:3px 0 14px; }
.p-badge {
  display:block; text-align:center; margin-bottom:14px;
  font-size:10px; letter-spacing:1px; text-transform:uppercase;
  padding:3px 12px; border-radius:20px; width:fit-content; margin:0 auto 14px;
}
.p-desc { font-size:13px; line-height:1.75; color:rgba(210,225,255,0.88); }
.p-facts { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fact {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
  border-radius:10px; padding:10px 12px;
}
.fact-k { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
.fact-v { font-size:12px; font-weight:500; color:#fff; }

#resetbtn {
  position:fixed; bottom:20px; right:16px; z-index:11;
  width:44px; height:44px; border-radius:50%;
  background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.25);
  color:var(--cyan); font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(8px); transition:background 0.2s;
}
#resetbtn:hover { background:rgba(0,212,255,0.18); }

#tooltip {
  position:fixed; z-index:15; pointer-events:none;
  background:rgba(8,8,35,0.9); border:1px solid var(--border);
  border-radius:8px; padding:6px 10px;
  font-size:11px; color:var(--text); letter-spacing:.5px;
  opacity:0; transition:opacity 0.15s;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<svg id="graph"></svg>

<div class="header">
  <h1>Mamíferos</h1>
  <p>Rede Filogenética Interativa · Toque para explorar</p>
</div>

<div id="legend"></div>
<div id="tooltip"></div>

<div id="panel">
  <div class="handle"></div>
  <button id="closebtn">✕</button>
  <div id="panelcontent"></div>
</div>

<button id="resetbtn" title="Centralizar">⊕</button>

<script>
(function(){
  const c = document.getElementById('stars');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const x = c.getContext('2d');
  for(let i=0;i<250;i++){
    x.beginPath();
    x.arc(Math.random()*c.width, Math.random()*c.height, Math.random()*1.3, 0, 6.28);
    x.fillStyle = `rgba(180,200,255,${(Math.random()*0.6+0.2).toFixed(2)})`;
    x.fill();
  }
})();

const CC = {
  root:'#FFD700', theria:'#e0a000',
  monotremata:'#00CED1', marsupialia:'#FF6B35',
  placentalia:'#a070e0', afrotheria:'#DA70D6',
  xenarthra:'#00C853', boreoeutheria:'#40C4FF',
  euarchontoglires:'#00E5FF', primates:'#00BCD4',
  rodentia:'#FF4081', lagomorpha:'#FFEB3B',
  laurasiatheria:'#FF6E40', carnivora:'#F44336',
  cetartiodactyla:'#2196F3', perissodactyla:'#FF9800',
  chiroptera:'#CE93D8', eulipotyphla:'#8BC34A',
};

const nodes = [
  {id:'mammalia',label:'Mammalia',type:'root',clade:'root',emoji:'🌍',scientific:'Mammalia',desc:'Classe dos vertebrados que inclui todos os animais que amamentam filhotes. Surgiram há ~220 Ma a partir de cinodontes. Hoje compreendem mais de 5.500 espécies que colonizaram terra, ar e mar.',facts:{'Espécies':'~5.500','Origem':'~220 Ma','Habitats':'Todos','Nível':'Classe'}},
  {id:'theria',label:'Theria',type:'clade',clade:'theria',emoji:'🧬',scientific:'Theria',desc:'Subclasse dos mamíferos vivíparos. Inclui marsupiais e placentários. Diferem dos monotremados por não botarem ovos e por possuírem estruturas reprodutivas mais derivadas.',facts:{'Espécies':'~5.400','Origem':'~180 Ma','Reprodução':'Vivíparos','Nível':'Subclasse'}},
  {id:'monotremata',label:'Monotremata',type:'clade',clade:'monotremata',emoji:'🥚',scientific:'Monotremata',desc:'Único grupo de mamíferos que bota ovos. Restritos à Austrália e Nova Guiné. Possuem características primitivas como cloaca única e eletrorrecepção — detectam campos elétricos para encontrar presas.',facts:{'Espécies':'5','Origem':'~166 Ma','Região':'Oceania','Nível':'Ordem'}},
  {id:'marsupialia',label:'Marsupialia',type:'clade',clade:'marsupialia',emoji:'🦘',scientific:'Metatheria',desc:'Mamíferos com marsúpio: filhotes nascem imaturos (1-2 cm) e completam o desenvolvimento dentro da bolsa. Dominam a fauna australiana e possuem mais de 300 espécies.',facts:{'Espécies':'~330','Origem':'~80 Ma','Região':'Oceania/Am. Sul','Nível':'Infraclasse'}},
  {id:'placentalia',label:'Placentalia',type:'clade',clade:'placentalia',emoji:'🫀',scientific:'Eutheria',desc:'Mamíferos com placenta desenvolvida, permitindo gestação longa e filhotes mais maduros ao nascer. O grupo mais diverso dos mamíferos, incluindo desde musaranhos a baleias-azuis.',facts:{'Espécies':'~5.000','Origem':'~100 Ma','Tipo':'Placentários','Nível':'Infraclasse'}},
  {id:'afrotheria',label:'Afrotheria',type:'clade',clade:'afrotheria',emoji:'🐘',scientific:'Afrotheria',desc:'Superordem de origem africana descoberta por análises moleculares nos anos 1990. Agrupa elefantes, sirênios, hiracóideos, aardvarks e outros — unidos por ancestralidade comum, não por aparência.',facts:{'Espécies':'~100','Origem':'~90 Ma','Região':'África (orig.)','Nível':'Superordem'}},
  {id:'xenarthra',label:'Xenarthra',type:'clade',clade:'xenarthra',emoji:'🦥',scientific:'Xenarthra',desc:'Grupo exclusivo das Américas que inclui tatus, preguiças e tamanduás. O nome refere-se às articulações vertebrais extras (xenartrias) que reforçam a coluna para escavar e pendurar.',facts:{'Espécies':'~31','Origem':'~60 Ma','Região':'Américas','Nível':'Superordem'}},
  {id:'boreoeutheria',label:'Boreoeutheria',type:'clade',clade:'boreoeutheria',emoji:'🌍',scientific:'Boreoeutheria',desc:'Maior clado de placentários, originou-se no hemisfério norte (Boreália). Divide-se em Euarchontoglires (primatas, roedores) e Laurasiatheria (carnívoros, cetáceos, morcegos e outros).',facts:{'Espécies':'~4.800','Origem':'~90 Ma','Região':'Hemisfério N (orig.)','Nível':'Superordem'}},
  {id:'euarchontoglires',label:'Euarchontoglires',type:'clade',clade:'euarchontoglires',emoji:'🧠',scientific:'Euarchontoglires',desc:'Clado que une primatas, roedores, lagomorfos e afins. Inclui os mamíferos mais encefalizados do planeta e também os mais numerosos em espécies (roedores).',facts:{'Espécies':'~2.700','Origem':'~80 Ma','Destaque':'Primatas, Roedores','Nível':'Grandordem'}},
  {id:'primates',label:'Primates',type:'clade',clade:'primates',emoji:'🐒',scientific:'Primates',desc:'Ordem caracterizada por visão binocular colorida, polegares oponíveis, unhas (em vez de garras) e alto desenvolvimento cerebral. Inclui mais de 500 espécies, da maioria ameaçada.',facts:{'Espécies':'~500','Origem':'~65 Ma','Encefalização':'Alta','Nível':'Ordem'}},
  {id:'rodentia',label:'Rodentia',type:'clade',clade:'rodentia',emoji:'🐭',scientific:'Rodentia',desc:'Maior ordem de mamíferos com ~40% das espécies. Todos possuem incisivos que crescem continuamente e precisam ser desgastados roendo. Colonizaram praticamente todos os ecossistemas terrestres.',facts:{'Espécies':'~2.200','Origem':'~66 Ma','Diversidade':'Máxima','Nível':'Ordem'}},
  {id:'lagomorpha',label:'Lagomorpha',type:'clade',clade:'lagomorpha',emoji:'🐇',scientific:'Lagomorpha',desc:'Inclui coelhos, lebres e pikas. Diferenciam-se dos roedores por ter dois pares de incisivos superiores (não um) e por praticarem cecotrofia — ingerem suas próprias fezes para reabsorver nutrientes.',facts:{'Espécies':'~90','Origem':'~60 Ma','Dieta':'Herbívora','Nível':'Ordem'}},
  {id:'laurasiatheria',label:'Laurasiatheria',type:'clade',clade:'laurasiatheria',emoji:'🌋',scientific:'Laurasiatheria',desc:'Clado originado no supercontinente Laurásia. Inclui a diversidade morfológica mais extrema dos mamíferos: do morcego (voador) à baleia (aquático), passando por carnívoros, ungulados e insetos.',facts:{'Espécies':'~2.100','Origem':'~85 Ma','Região':'Laurásia (orig.)','Nível':'Superordem'}},
  {id:'carnivora',label:'Carnivora',type:'clade',clade:'carnivora',emoji:'🦁',scientific:'Carnivora',desc:'Inclui felinos, canídeos, ursídeos, mustelídeos e pinípedes. O nome refere-se à origem, não à dieta atual — pandas, lontras e meerkat são onívoros ou quase herbívoros.',facts:{'Espécies':'~280','Origem':'~60 Ma','Dieta':'Variada','Nível':'Ordem'}},
  {id:'cetartiodactyla',label:'Cetartiodactyla',type:'clade',clade:'cetartiodactyla',emoji:'🐋',scientific:'Cetartiodactyla',desc:'Clado que une cetáceos (baleias, golfinhos) com artiodáctilos (porcos, girafas, vacas). DNA molecular revelou que hipopótamos são os parentes vivos mais próximos das baleias.',facts:{'Espécies':'~350','Origem':'~55 Ma','Habitat':'Terra e Mar','Nível':'Ordem'}},
  {id:'perissodactyla',label:'Perissodactyla',type:'clade',clade:'perissodactyla',emoji:'🐴',scientific:'Perissodactyla',desc:'Ungulados com número ímpar de dedos funcionais. Inclui cavalos (1 dedo), antas (4 e 3 dedos) e rinocerontes (3 dedos). Foram mais diversos no Eoceno; hoje apenas 17 espécies sobrevivem.',facts:{'Espécies':'17','Origem':'~56 Ma','Dedos':'Ímpar','Nível':'Ordem'}},
  {id:'chiroptera',label:'Chiroptera',type:'clade',clade:'chiroptera',emoji:'🦇',scientific:'Chiroptera',desc:'Únicos mamíferos com voo verdadeiro. Segunda maior ordem em espécies (~1.400). A maioria usa ecolocação ultrassônica para navegar e caçar no escuro. Essenciais como polinizadores e controladores de insetos.',facts:{'Espécies':'~1.400','Origem':'~55 Ma','Habilidade':'Ecolocação','Nível':'Ordem'}},
  {id:'eulipotyphla',label:'Eulipotyphla',type:'clade',clade:'eulipotyphla',emoji:'🦔',scientific:'Eulipotyphla',desc:'Inclui ouriços, toupeiras e musaranhos. Frequentemente considerados de morfologia primitiva. Musaranhos têm o maior metabolismo de qualquer mamífero — comem quase o próprio peso por dia.',facts:{'Espécies':'~500','Origem':'~60 Ma','Porte':'Pequeno','Nível':'Ordem'}},
  {id:'platypus',label:'Ornitorrinco',type:'species',clade:'monotremata',emoji:'🦆',scientific:'Ornithorhynchus anatinus',desc:'Um dos animais mais únicos da Terra: mamífero que bota ovos, possui bico de pato, rabo de castor e veneno. Detecta presas por eletrorrecepção — um dos poucos vertebrados com esse sentido.',facts:{'Peso':'0,7–2,4 kg','Longevidade':'~17 anos','Habitat':'Rios da Austrália','Status':'Quase Ameaçado'}},
  {id:'echidna',label:'Equidna',type:'species',clade:'monotremata',emoji:'🦔',scientific:'Tachyglossus aculeatus',desc:'Coberto de espinhos de queratina. Possui o cérebro proporcionalmente maior entre os mamíferos em relação ao corpo. Come formigas e cupins com língua comprida e pegajosa. Pode hibernar por meses.',facts:{'Peso':'2–5 kg','Longevidade':'~45 anos','Habitat':'Austrália','Status':'Pouco Preocupante'}},
  {id:'kangaroo',label:'Canguru-vermelho',type:'species',clade:'marsupialia',emoji:'🦘',scientific:'Macropus rufus',desc:'Maior marsupial vivo. Salta a 70 km/h, com até 9 m por salto. Filhotes nascem com 2,5 cm e ficam ~8 meses no marsúpio. Usa a cauda como "terceira perna" ao descansar.',facts:{'Peso':'25–90 kg','Longevidade':'~22 anos','Habitat':'Austrália','Status':'Pouco Preocupante'}},
  {id:'koala',label:'Coala',type:'species',clade:'marsupialia',emoji:'🐨',scientific:'Phascolarctos cinereus',desc:'Dorme até 22 horas/dia para economizar energia — eucalipto é pobre em nutrientes e levemente tóxico. Possui impressões digitais quase idênticas às humanas. Filhotes comem fezes da mãe para adquirir bactérias digestivas.',facts:{'Peso':'4–15 kg','Longevidade':'~18 anos','Habitat':'Austrália SE','Status':'Vulnerável'}},
  {id:'tasmanian_devil',label:'Diabo-da-Tasmânia',type:'species',clade:'marsupialia',emoji:'😈',scientific:'Sarcophilus harrisii',desc:'Mordida mais forte proporcionalmente entre mamíferos. Ameaçado pelo Tumor Facial do Diabo da Tasmânia (DFTD), câncer contagioso raro. Projeto de reintrodução no continente australiano está em andamento.',facts:{'Peso':'6–14 kg','Longevidade':'~6 anos','Habitat':'Tasmânia','Status':'Ameaçado'}},
  {id:'elephant',label:'Elefante-africano',type:'species',clade:'afrotheria',emoji:'🐘',scientific:'Loxodonta africana',desc:'Maior animal terrestre. Tromba com ~100.000 músculos. Alta inteligência: usa ferramentas, passa no teste do espelho, pratica luto pelos mortos. Migra centenas de km lembrando rotas de gerações anteriores.',facts:{'Peso':'3.500–6.000 kg','Longevidade':'~70 anos','Habitat':'África sub-saariana','Status':'Vulnerável'}},
  {id:'manatee',label:'Peixe-boi',type:'species',clade:'afrotheria',emoji:'🌊',scientific:'Trichechus manatus',desc:'Parente dos elefantes, não dos peixes. Herbívoro aquático que renova molares de trás para frente ao longo da vida. Pode ficar até 20 min submerso. Inspirou lendas de sereias para marinheiros.',facts:{'Peso':'400–600 kg','Longevidade':'~60 anos','Habitat':'Costas tropicais','Status':'Vulnerável'}},
  {id:'aardvark',label:'Aardvark',type:'species',clade:'afrotheria',emoji:'🐾',scientific:'Orycteropus afer',desc:'Único membro da ordem Tubulidentata. Escava tocas enormes usadas por dezenas de outras espécies. Come até 50.000 formigas por noite com língua longa e pegajosa. Escuta perturbações subterrâneas com orelhas longas.',facts:{'Peso':'40–65 kg','Longevidade':'~23 anos','Habitat':'África','Status':'Pouco Preocupante'}},
  {id:'armadillo',label:'Tatu-gigante',type:'species',clade:'xenarthra',emoji:'🛡️',scientific:'Priodontes maximus',desc:'Maior tatu vivo. Couraça formada por placas ósseas (osteodermos). Suas tocas são usadas por ariranhas, raposas e cobras. Garras dianteiras são as mais longas entre mamíferos em proporção ao corpo.',facts:{'Peso':'18–32 kg','Longevidade':'~12 anos','Habitat':'Am. do Sul','Status':'Vulnerável'}},
  {id:'sloth',label:'Preguiça-de-três-dedos',type:'species',clade:'xenarthra',emoji:'🦥',scientific:'Bradypus tridactylus',desc:'Mamífero mais lento do mundo — move-se a 0,24 km/h. Desce das árvores só uma vez por semana para defecar. Algas crescem em sua pelagem dando camuflagem verde. Passa 90% do tempo imóvel.',facts:{'Peso':'3–4,5 kg','Longevidade':'~20 anos','Habitat':'Amazônia','Status':'Pouco Preocupante'}},
  {id:'anteater',label:'Tamanduá-bandeira',type:'species',clade:'xenarthra',emoji:'🐜',scientific:'Myrmecophaga tridactyla',desc:'Come até 35.000 insetos/dia. Não tem dentes — usa o estômago musculoso com areia para triturar. Língua chega a 60 cm e entra/sai da boca 150 vezes por minuto. Temperatura corporal varia com o ambiente.',facts:{'Peso':'25–40 kg','Longevidade':'~16 anos','Habitat':'Am. Central e Sul','Status':'Vulnerável'}},
  {id:'human',label:'Ser Humano',type:'species',clade:'primates',emoji:'🧑',scientific:'Homo sapiens',desc:'Primata com maior encéfalo proporcional. Compartilha 98,7% do DNA com chimpanzés. A única espécie com linguagem simbólica complexa, escrita, tecnologia cumulativa e autoconsciência filosófica documentada.',facts:{'Peso':'50–80 kg','Longevidade':'~79 anos','Cérebro':'1.300 cm³','Status':'Pouco Preocupante'}},
  {id:'chimpanzee',label:'Chimpanzé',type:'species',clade:'primates',emoji:'🐒',scientific:'Pan troglodytes',desc:'Parente mais próximo dos humanos (98,7% de DNA idêntico). Usa ferramentas, resolve problemas, possui cultura transmitida entre gerações e demonstra empatia. Possui 4 subespécies distintas.',facts:{'Peso':'32–60 kg','Longevidade':'~45 anos','DNA humano':'98,7%','Status':'Ameaçado'}},
  {id:'gorilla',label:'Gorila',type:'species',clade:'primates',emoji:'🦍',scientific:'Gorilla gorilla',desc:'Maior primata vivo. Apesar da aparência intimidadora, é essencialmente herbívoro. Vive em grupos liderados por macho costas-prateadas. Pode aprender linguagem de sinais em cativeiro.',facts:{'Peso':'70–200 kg','Longevidade':'~40 anos','Habitat':'África Central','Status':'Criticamente Ameaçado'}},
  {id:'orangutan',label:'Orangutango',type:'species',clade:'primates',emoji:'🦧',scientific:'Pongo pygmaeus',desc:'Maior mamífero arborícola. Braços chegam a 2,4 m de envergadura. Amamentação mais longa dos primatas: até 8 anos. Constrói "guarda-chuvas" de folhas e usa ferramentas complexas de pedra e madeira.',facts:{'Peso':'30–90 kg','Longevidade':'~45 anos','Habitat':'Bornéu e Sumatra','Status':'Criticamente Ameaçado'}},
  {id:'capybara',label:'Capivara',type:'species',clade:'rodentia',emoji:'🐾',scientific:'Hydrochoerus hydrochaeris',desc:'Maior roedor vivo. Semiacuático e extremamente social. Considerado o animal mais amigável do mundo por coexistir pacificamente com macacos, patos, jacarés e até onças. Símbolo cultural brasileiro.',facts:{'Peso':'35–66 kg','Longevidade':'~12 anos','Habitat':'Am. do Sul','Status':'Pouco Preocupante'}},
  {id:'beaver',label:'Castor',type:'species',clade:'rodentia',emoji:'🦫',scientific:'Castor canadensis',desc:'Engenheiro do ecossistema: suas represas criam wetlands que beneficiam centenas de espécies. Barragens podem durar décadas e alterar cursos de rios inteiros. Segundo maior roedor do mundo.',facts:{'Peso':'16–32 kg','Longevidade':'~24 anos','Habitat':'América do Norte','Status':'Pouco Preocupante'}},
  {id:'mouse',label:'Camundongo',type:'species',clade:'rodentia',emoji:'🐭',scientific:'Mus musculus',desc:'Mamífero mais estudado da ciência. Compartilha ~85% dos genes com humanos. Fundamental para medicina, genética e neurociência. Uma única fêmea pode ter até 300 descendentes em um ano.',facts:{'Peso':'12–30 g','Longevidade':'~2 anos','Genes humanos':'~85%','Status':'Pouco Preocupante'}},
  {id:'rabbit',label:'Coelho',type:'species',clade:'lagomorpha',emoji:'🐇',scientific:'Oryctolagus cuniculus',desc:'Come suas próprias fezes cecais (cecotrofia) para reabsorver proteínas e vitaminas B. Visão de quase 360° para detectar predadores. Pode girar orelhas 270° independentemente para localizar sons.',facts:{'Peso':'1,5–3 kg','Longevidade':'~12 anos','Habitat':'Global (introduzido)','Status':'Quase Ameaçado'}},
  {id:'lion',label:'Leão',type:'species',clade:'carnivora',emoji:'🦁',scientific:'Panthera leo',desc:'Único felino social, vivendo em alcateias. Rugido audível a 8 km. Fêmeas realizam 90% das caças. Único felino com dimorfismo sexual marcante — juba do macho indica saúde e dominância.',facts:{'Peso':'120–250 kg','Longevidade':'~16 anos','Habitat':'África e Índia','Status':'Vulnerável'}},
  {id:'wolf',label:'Lobo-cinzento',type:'species',clade:'carnivora',emoji:'🐺',scientific:'Canis lupus',desc:'Predador de topo que regula ecossistemas. Reintrodução em Yellowstone (1995) alterou cursos dos rios por cascatas tróficas — os veados mudaram comportamento, vegetação recuperou margens fluviais.',facts:{'Peso':'20–70 kg','Longevidade':'~13 anos','Habitat':'Hemisfério Norte','Status':'Pouco Preocupante'}},
  {id:'polar_bear',label:'Urso-polar',type:'species',clade:'carnivora',emoji:'🐻‍❄️',scientific:'Ursus maritimus',desc:'Maior carnívoro terrestre. Pelos são ocos e transparentes (não brancos). Nada por horas no Ártico. Faro detecta focas a 30 km. Metabolismo muda radicalmente no inverno — quase hibernação sem entrar em torpor.',facts:{'Peso':'350–700 kg','Longevidade':'~25 anos','Habitat':'Ártico','Status':'Vulnerável'}},
  {id:'orca',label:'Orca',type:'species',clade:'carnivora',emoji:'🐳',scientific:'Orcinus orca',desc:'Maior dos golfinhos, mas classificada em Carnivora. Possui cultura: populações diferentes têm dialetos únicos, técnicas de caça transmitidas culturalmente e preferências alimentares regionais.',facts:{'Peso':'3.600–5.400 kg','Longevidade':'~80 anos','Habitat':'Oceanos globais','Status':'Dados Insuficientes'}},
  {id:'blue_whale',label:'Baleia-azul',type:'species',clade:'cetartiodactyla',emoji:'🐋',scientific:'Balaenoptera musculus',desc:'O maior animal que já viveu na Terra — maior que qualquer dinossauro. Coração de ~180 kg bate 2–8 vezes/min. Filhotes ganham 90 kg/dia. Emite sons de até 188 dB, audíveis a centenas de km.',facts:{'Peso':'100.000–150.000 kg','Longevidade':'~90 anos','Habitat':'Oceanos globais','Status':'Em Perigo'}},
  {id:'dolphin',label:'Golfinho-nariz-de-garrafa',type:'species',clade:'cetartiodactyla',emoji:'🐬',scientific:'Tursiops truncatus',desc:'Um dos animais mais inteligentes. Autoconsciência confirmada (espelho). Usa esponjas como ferramenta de caça. Dorme com metade do cérebro ativa. Possui nomes individuais — assobios únicos para cada indivíduo.',facts:{'Peso':'150–650 kg','Longevidade':'~50 anos','Habitat':'Oceanos globais','Status':'Pouco Preocupante'}},
  {id:'giraffe',label:'Girafa',type:'species',clade:'cetartiodactyla',emoji:'🦒',scientific:'Giraffa camelopardalis',desc:'Animal mais alto do planeta (até 5,8 m). Possui 7 vértebras cervicais como humanos, cada uma com ~28 cm. Coração de 11 kg bombeia sangue 2 m acima do coração. Dorme apenas 30 min por dia.',facts:{'Peso':'750–1.750 kg','Longevidade':'~26 anos','Altura':'até 5,8 m','Status':'Vulnerável'}},
  {id:'hippo',label:'Hipopótamo',type:'species',clade:'cetartiodactyla',emoji:'🦛',scientific:'Hippopotamus amphibius',desc:'Parente mais próximo das baleias. Segrega líquido vermelho-rosado com propriedades de protetor solar e antibiótico natural. Apesar da aparência, é o mamífero terrestre mais perigoso da África.',facts:{'Peso':'1.500–3.000 kg','Longevidade':'~40 anos','Habitat':'África sub-saariana','Status':'Vulnerável'}},
  {id:'horse',label:'Cavalo',type:'species',clade:'perissodactyla',emoji:'🐴',scientific:'Equus caballus',desc:'Dominou o transporte e guerras por 5.000 anos. Dorme em pé por mecanismo de "bloqueio" nos joelhos. Maior globo ocular entre mamíferos terrestres. Velocidade máxima de 70 km/h.',facts:{'Peso':'380–550 kg','Longevidade':'~25 anos','Vel. máx':'70 km/h','Status':'Doméstico'}},
  {id:'rhino',label:'Rinoceronte-branco',type:'species',clade:'perissodactyla',emoji:'🦏',scientific:'Ceratotherium simum',desc:'Segundo maior animal terrestre. "Chifre" feito de queratina compactada, não de osso. Excelente corredor para seu porte: 50 km/h. Pele de 5 cm de espessura protege contra espinhos e mordidas.',facts:{'Peso':'1.400–3.600 kg','Longevidade':'~40 anos','Chifre':'Queratina','Status':'Quase Ameaçado'}},
  {id:'vampire_bat',label:'Morcego-vampiro',type:'species',clade:'chiroptera',emoji:'🧛',scientific:'Desmodus rotundus',desc:'Um dos poucos mamíferos hematófagos. Sensores IR no nariz detectam veias. Anticoagulante da saliva (draculin) é usado em medicina para tratar AVC. Compartilha sangue com companheiros de bando em jejum.',facts:{'Peso':'25–40 g','Longevidade':'~9 anos','Habitat':'Américas tropicais','Status':'Pouco Preocupante'}},
  {id:'fruit_bat',label:'Morcego-da-índia',type:'species',clade:'chiroptera',emoji:'🦇',scientific:'Pteropus giganteus',desc:'Maior morcego do mundo: envergadura de até 1,7 m. Essencial para polinização e dispersão de sementes em florestas tropicais. Ao contrário de outros morcegos, não usa ecolocação — navega pela visão e olfato.',facts:{'Peso':'0,6–1,6 kg','Longevidade':'~31 anos','Envergadura':'até 1,7 m','Status':'Vulnerável'}},
  {id:'hedgehog',label:'Ouriço-europeu',type:'species',clade:'eulipotyphla',emoji:'🦔',scientific:'Erinaceus europaeus',desc:'Coberto por ~5.000 espinhos ocos de queratina. Imunidade parcial a venenos de víbora. Hiberna no inverno. Pode percorrer 3 km por noite. Quando ameaçado, enrola-se em bola perfeita expondo apenas espinhos.',facts:{'Peso':'600–1.100 g','Longevidade':'~10 anos','Espinhos':'~5.000','Status':'Pouco Preocupante'}},
  {id:'mole',label:'Toupeira',type:'species',clade:'eulipotyphla',emoji:'⛏️',scientific:'Talpa europaea',desc:'Escava até 20 m de túneis por dia com patas dianteiras em forma de pá. Sangue com alta capacidade de ligar CO₂, permitindo viver em solos mal ventilados. "Vê" com receptores táteis no focinho (órgão de Eimer).',facts:{'Peso':'70–130 g','Longevidade':'~3 anos','Túneis/dia':'até 20 m','Status':'Pouco Preocupante'}},
];

const links = [
  {source:'mammalia',target:'monotremata'},{source:'mammalia',target:'theria'},
  {source:'theria',target:'marsupialia'},{source:'theria',target:'placentalia'},
  {source:'placentalia',target:'afrotheria'},{source:'placentalia',target:'xenarthra'},
  {source:'placentalia',target:'boreoeutheria'},
  {source:'boreoeutheria',target:'euarchontoglires'},{source:'boreoeutheria',target:'laurasiatheria'},
  {source:'euarchontoglires',target:'primates'},{source:'euarchontoglires',target:'rodentia'},
  {source:'euarchontoglires',target:'lagomorpha'},
  {source:'laurasiatheria',target:'carnivora'},{source:'laurasiatheria',target:'cetartiodactyla'},
  {source:'laurasiatheria',target:'perissodactyla'},{source:'laurasiatheria',target:'chiroptera'},
  {source:'laurasiatheria',target:'eulipotyphla'},
  {source:'monotremata',target:'platypus'},{source:'monotremata',target:'echidna'},
  {source:'marsupialia',target:'kangaroo'},{source:'marsupialia',target:'koala'},
  {source:'marsupialia',target:'tasmanian_devil'},
  {source:'afrotheria',target:'elephant'},{source:'afrotheria',target:'manatee'},
  {source:'afrotheria',target:'aardvark'},
  {source:'xenarthra',target:'armadillo'},{source:'xenarthra',target:'sloth'},
  {source:'xenarthra',target:'anteater'},
  {source:'primates',target:'human'},{source:'primates',target:'chimpanzee'},
  {source:'primates',target:'gorilla'},{source:'primates',target:'orangutan'},
  {source:'rodentia',target:'capybara'},{source:'rodentia',target:'beaver'},
  {source:'rodentia',target:'mouse'},
  {source:'lagomorpha',target:'rabbit'},
  {source:'carnivora',target:'lion'},{source:'carnivora',target:'wolf'},
  {source:'carnivora',target:'polar_bear'},{source:'carnivora',target:'orca'},
  {source:'cetartiodactyla',target:'blue_whale'},{source:'cetartiodactyla',target:'dolphin'},
  {source:'cetartiodactyla',target:'giraffe'},{source:'cetartiodactyla',target:'hippo'},
  {source:'perissodactyla',target:'horse'},{source:'perissodactyla',target:'rhino'},
  {source:'chiroptera',target:'vampire_bat'},{source:'chiroptera',target:'fruit_bat'},
  {source:'eulipotyphla',target:'hedgehog'},{source:'eulipotyphla',target:'mole'},
];

const legendClades = [
  ['monotremata','Monotremata'],['marsupialia','Marsupialia'],
  ['afrotheria','Afrotheria'],['xenarthra','Xenarthra'],
  ['primates','Primates'],['rodentia','Rodentia'],
  ['carnivora','Carnivora'],['cetartiodactyla','Cetartiodactyla'],
  ['perissodactyla','Perissodactyla'],['chiroptera','Chiroptera'],
  ['eulipotyphla','Eulipotyphla'],
];
const legend = document.getElementById('legend');
legend.innerHTML = '<div class="leg-title">Grupos</div>' +
  legendClades.map(([k,l]) =>
    `<div class="leg-item"><div class="leg-dot" style="background:${CC[k]};box-shadow:0 0 6px ${CC[k]}66"></div><span class="leg-label">${l}</span></div>`
  ).join('');

const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select('#graph').attr('width', W).attr('height', H);
const defs = svg.append('defs');
function makeGlow(id, color, blur=8, op=0.9) {
  const f = defs.append('filter').attr('id', id).attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  f.append('feDropShadow').attr('dx',0).attr('dy',0).attr('stdDeviation',blur)
   .attr('flood-color',color).attr('flood-opacity',op);
}
makeGlow('glow-root','#FFD700',12);
makeGlow('glow-cyan','#00d4ff',8);
makeGlow('glow-select','#ffffff',14);
Object.entries(CC).forEach(([k,v]) => makeGlow(`glow-${k}`,v,6,0.7));

const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.15,4]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);
const isClade = n => n.type === 'root' || n.type === 'clade';

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id)
    .distance(d => {
      const s = nodeMap[d.source.id||d.source];
      const t = nodeMap[d.target.id||d.target];
      if(s.type==='root' || t.type==='root') return 140;
      if(isClade(s) && isClade(t)) return 120;
      if(isClade(s) || isClade(t)) return 80;
      return 50;
    })
    .strength(d => {
      const s = nodeMap[d.source.id||d.source];
      const t = nodeMap[d.target.id||d.target];
      return isClade(s) && isClade(t) ? 0.8 : 0.5;
    })
  )
  .force('charge', d3.forceManyBody().strength(d => isClade(d) ? -600 : -200))
  .force('center', d3.forceCenter(W/2, H/2).strength(0.05))
  .force('collide', d3.forceCollide(d => nodeRadius(d) + 10))
  .alphaDecay(0.025);

function nodeRadius(d) {
  if(d.type==='root') return 28;
  if(d.type==='clade') return 18;
  return 11;
}

const linkG = g.append('g').attr('class','links');
const linkEl = linkG.selectAll('line').data(links).enter().append('line')
  .attr('stroke', d => { const t = nodeMap[d.target.id||d.target]; return CC[t.clade] || '#ffffff'; })
  .attr('stroke-opacity', 0.35)
  .attr('stroke-width', d => {
    const s = nodeMap[d.source.id||d.source];
    const t = nodeMap[d.target.id||d.target];
    return isClade(s) && isClade(t) ? 2 : 1;
  });

const nodeG = g.append('g').attr('class','nodes');
const nodeEl = nodeG.selectAll('g').data(nodes).enter().append('g')
  .attr('class','node')
  .style('cursor','pointer')
  .call(d3.drag()
    .on('start', (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on('end',   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
  )
  .on('click', (e,d) => { e.stopPropagation(); selectNode(d); })
  .on('touchstart', (e,d) => { e.stopPropagation(); }, {passive:true});

nodeEl.filter(d => isClade(d)).append('circle')
  .attr('class','pulse-ring')
  .attr('r', d => nodeRadius(d)+6)
  .attr('fill','none')
  .attr('stroke', d => CC[d.clade])
  .attr('stroke-width', 1)
  .attr('stroke-opacity', 0.3);

nodeEl.append('circle')
  .attr('r', d => nodeRadius(d))
  .attr('fill', d => d.type==='root' ? '#1a1500' : d.type==='clade' ? '#0a0a1e' : '#060618')
  .attr('stroke', d => CC[d.clade] || '#ffffff')
  .attr('stroke-width', d => d.type==='root' ? 3 : d.type==='clade' ? 2 : 1.5)
  .attr('filter', d => `url(#glow-${d.clade})`);

nodeEl.append('text')
  .attr('text-anchor','middle').attr('dominant-baseline','central')
  .attr('font-size', d => d.type==='root' ? 16 : d.type==='clade' ? 13 : 9)
  .attr('pointer-events','none')
  .text(d => d.emoji);

nodeEl.append('text')
  .attr('text-anchor','middle')
  .attr('y', d => nodeRadius(d)+13)
  .attr('font-size', d => d.type==='root' ? 11 : d.type==='clade' ? 10 : 8)
  .attr('fill', d => CC[d.clade] || '#fff')
  .attr('fill-opacity', 0.9)
  .attr('pointer-events','none')
  .text(d => d.label);

nodeEl.append('circle')
  .attr('class','select-ring')
  .attr('r', d => nodeRadius(d)+8)
  .attr('fill','none')
  .attr('stroke','#ffffff')
  .attr('stroke-width', 1.5)
  .attr('stroke-dasharray','4 3')
  .attr('opacity', 0);

sim.on('tick', () => {
  linkEl
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeEl.attr('transform', d => `translate(${d.x},${d.y})`);
});

function animatePulse() {
  d3.selectAll('.pulse-ring')
    .transition().duration(2000).ease(d3.easeSinInOut)
    .attr('stroke-opacity', 0.6).attr('r', function() {
      return +d3.select(this.parentNode).datum().type === 'root'
        ? nodeRadius(d3.select(this.parentNode).datum()) + 12
        : nodeRadius(d3.select(this.parentNode).datum()) + 9;
    })
    .transition().duration(2000).ease(d3.easeSinInOut)
    .attr('stroke-opacity', 0.15)
    .attr('r', function() { return nodeRadius(d3.select(this.parentNode).datum()) + 4; })
    .on('end', animatePulse);
}
setTimeout(animatePulse, 2500);

let selected = null;
function selectNode(d) {
  d3.selectAll('.select-ring').attr('opacity', 0);
  const el = nodeEl.filter(n => n.id === d.id);
  el.select('.select-ring').attr('opacity', 1);
  selected = d;
  linkEl
    .attr('stroke-opacity', l => (l.source.id===d.id||l.target.id===d.id) ? 0.9 : 0.1)
    .attr('stroke-width', l => (l.source.id===d.id||l.target.id===d.id) ? 3 : 1);
  nodeEl.attr('opacity', n => {
    if(n.id===d.id) return 1;
    const linked = links.some(l =>
      (l.source.id===d.id && l.target.id===n.id) ||
      (l.target.id===d.id && l.source.id===n.id)
    );
    return linked ? 0.9 : 0.25;
  });
  showPanel(d);
}

svg.on('click', () => {
  d3.selectAll('.select-ring').attr('opacity', 0);
  linkEl.attr('stroke-opacity', 0.35).attr('stroke-width', d => {
    const s = nodeMap[d.source.id||d.source];
    const t = nodeMap[d.target.id||d.target];
    return isClade(s) && isClade(t) ? 2 : 1;
  });
  nodeEl.attr('opacity', 1);
  closePanel();
  selected = null;
});

function showPanel(d) {
  const color = CC[d.clade] || '#00d4ff';
  const facts = Object.entries(d.facts||{}).map(([k,v]) =>
    `<div class="fact"><div class="fact-k">${k}</div><div class="fact-v">${v}</div></div>`
  ).join('');
  document.getElementById('panelcontent').innerHTML = `
    <div class="p-emoji">${d.emoji}</div>
    <div class="p-name">${d.label}</div>
    <div class="p-sci">${d.scientific}</div>
    <div class="p-badge" style="background:${color}22;border:1px solid ${color}44;color:${color}">${d.type==='species'?'Espécie':'Grupo'}</div>
    <div class="p-desc">${d.desc}</div>
    ${facts ? `<div class="p-facts">${facts}</div>` : ''}
  `;
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  document.getElementById('panel').classList.remove('open');
}
document.getElementById('closebtn').addEventListener('click', e => {
  e.stopPropagation();
  closePanel();
  d3.selectAll('.select-ring').attr('opacity', 0);
  linkEl.attr('stroke-opacity', 0.35).attr('stroke-width', d => {
    const s = nodeMap[d.source.id||d.source];
    const t = nodeMap[d.target.id||d.target];
    return isClade(s) && isClade(t) ? 2 : 1;
  });
  nodeEl.attr('opacity', 1);
  selected = null;
});

document.getElementById('resetbtn').addEventListener('click', () => {
  svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity);
});

let touchY = 0;
document.getElementById('panel').addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
document.getElementById('panel').addEventListener('touchmove', e => {
  if(e.touches[0].clientY - touchY > 60) closePanel();
}, {passive:true});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('width',w).attr('height',h);
  sim.force('center', d3.forceCenter(w/2, h/2)).alpha(0.1).restart();
});
</script>
</body>
</html>
